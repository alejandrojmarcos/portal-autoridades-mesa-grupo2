<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charlas de orientación</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand">Portal para Autoridades de Mesa</span>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link active" href="index.html">Charlas</a>
        <a class="nav-link" href="postulantes.html">Postulantes</a>
      </div>
    </div>
  </nav>
  <main class="container">
    <h1 class="h4">Charlas de orientación</h1>
    <p class="text-secondary">Elegí una charla para ver dónde se dicta.</p>

    <div class="row g-4">
      <div class="col-lg-5">
        <div id="mensaje-charlas"></div>
        <div id="lista-charlas" class="list-group"></div>
      </div>

      <div class="col-lg-7">
        <div class="card">
          <div class="card-body">
            <div id="detalle" class="mb-3 text-secondary">Ninguna charla seleccionada.</div>
            <div id="mensaje-mapa"></div>
            <div id="mapa"></div>
            <p id="direccion-usig" class="small text-secondary mt-2 mb-3"></p>

            <form id="form-direccion" class="input-group">
              <input id="direccion" class="form-control" placeholder="Probar otra dirección, ej.: Av. Corrientes 1234, CABA">
              <button class="btn btn-outline-primary">Buscar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charlas.js"></script>
</body>
</html>
