<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postularme</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand">Portal para Autoridades de Mesa</span>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link" href="index.html">Charlas</a>
        <a class="nav-link" href="postulantes.html">Postulantes</a>
      </div>
    </div>
  </nav>
  <main class="container" style="max-width: 720px">
    <h1 class="h4">Postulate como autoridad de mesa</h1>
    <p id="estado-convocatoria" class="text-secondary"></p>
    <div id="mensaje"></div>

    <form id="form-registro" class="card card-body" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="nombre">Nombre *</label>
          <input class="form-control" id="nombre" name="nombre">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="apellido">Apellido *</label>
          <input class="form-control" id="apellido" name="apellido">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="dni">DNI *</label>
          <input class="form-control" id="dni" name="dni" placeholder="Sin puntos">
        </div>
        <div class="col-md-8">
          <label class="form-label" for="email">Correo electrónico *</label>
          <input class="form-control" id="email" name="email" type="email">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="telefono">Teléfono</label>
          <input class="form-control" id="telefono" name="telefono">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="distrito">Distrito electoral *</label>
          <select class="form-select" id="distrito" name="distrito">
            <option value="">Seleccionar…</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="antecedentes">Antecedentes</label>
          <textarea class="form-control" id="antecedentes" name="antecedentes" rows="3"
            placeholder="Experiencia previa en elecciones u otros datos que quieras contar"></textarea>
        </div>
        <div class="col-12">
          <p class="form-label mb-1">Charlas a las que te gustaría asistir (opcional)</p>
          <div id="charlas"></div>
        </div>
      </div>
      <button class="btn btn-primary mt-4 align-self-start">Enviar postulación</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
