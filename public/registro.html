<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postularse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand">Portal para Autoridades de Mesa</span>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link" href="index.html">Charlas</a>
        <a class="nav-link active" href="registro.html">Postularse</a>
      </div>
    </div>
  </nav>
  <main class="container" style="max-width: 720px">
    <h1 class="h4">Postulate como autoridad de mesa</h1>
    <p id="estado-convocatoria" class="text-secondary"></p>
    <div id="mensaje"></div>

    <form id="form-registro" class="card card-body" novalidate>
      <div class="row g-3">
        <div class="col-md-12 mb-2">
          <label class="form-label" for="distrito">Distrito electoral *</label>
          <select class="form-select" id="distrito" name="distrito" required>
            <option value="">Seleccionar…</option>
          </select>
        </div>
        
        <div class="col-md-6">
          <label class="form-label" for="nombre">Nombre *</label>
          <input class="form-control" id="nombre" name="nombre" maxlength="50" autocomplete="given-name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="apellido">Apellido *</label>
          <input class="form-control" id="apellido" name="apellido" maxlength="50" autocomplete="family-name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="dni">DNI *</label>
          <input class="form-control" id="dni" name="dni" placeholder="Sin puntos" inputmode="numeric" maxlength="8" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="fechaNacimiento">Fecha de nacimiento *</label>
          <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="direccionActual">Dirección Actual *</label>
          <input class="form-control" id="direccionActual" name="direccionActual" placeholder="Calle y altura" maxlength="120" autocomplete="street-address" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="telefono">Teléfono *</label>
          <input class="form-control" id="telefono" name="telefono" type="tel" placeholder="Ej.: 11 5555-1234" maxlength="20" autocomplete="tel" required>
        </div>

        <div class="col-md-12">
          <label class="form-label" for="email">Correo electrónico *</label>
          <input class="form-control" id="email" name="email" type="email" maxlength="100" autocomplete="email" required>
        </div>

        <div class="col-12 mt-4">
          <label class="form-label" for="autoridadPrevia">¿Fue autoridad de mesa previamente? *</label>
          <select class="form-select" id="autoridadPrevia" name="autoridadPrevia" required>
            <option value="" selected disabled>Seleccione una opción</option>
            <option value="si">Sí</option>
            <option value="no">No</option>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label" for="capacitacion">¿Cumplió con la capacitación? *</label>
          <select class="form-select" id="capacitacion" name="capacitacion" required>
            <option value="" selected disabled>Seleccione una opción</option>
            <option value="si">Sí</option>
            <option value="no">No</option>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label" for="afiliado">¿Es afiliado a alguna agrupación? *</label>
          <select class="form-select" id="afiliado" name="afiliado" required>
            <option value="" selected disabled>Seleccione una opción</option>
            <option value="si">Sí</option>
            <option value="no">No</option>
          </select>
        </div>

        <div class="col-12" id="contenedor-partido" hidden>
          <label class="form-label" for="partido">Detalle el partido político *</label>
          <input class="form-control" id="partido" name="partido" maxlength="100" placeholder="Nombre de la agrupación">
        </div>

        <div class="col-12 mt-4">
          <p class="form-label mb-1">Charlas a las que te gustaría asistir (opcional)</p>
          <div id="charlas"></div>
        </div>
      </div>
      <button class="btn btn-primary mt-4 align-self-start">Enviar postulación</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
